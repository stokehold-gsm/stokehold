# Only for hosts where discord.com is blocked: send the bot's outbound
# requests through the local xray SOCKS proxy (deploy/xray.service).
# Install as /etc/systemd/system/stokehold-bot.service.d/proxy.conf
[Unit]
After=xray.service
Wants=xray.service

[Service]
Environment=HTTPS_PROXY=socks5://127.0.0.1:1080
Environment=NO_PROXY=127.0.0.1,localhost
